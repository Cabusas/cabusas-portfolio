<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logos | Eleniño Cabusas</title>

  <link rel="stylesheet" href="../../style.css">

  <style>

    .logo-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 70px 7%;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 35px;
      color: #b45cff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .logo-heading {
      margin-bottom: 45px;
    }

    .logo-heading h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 5vw, 60px);
    }

    .logo-heading p {
      max-width: 650px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    /* LOGO GRID */

    .logo-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .logo-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: 0.3s ease;
    }

    .logo-item:hover {
      transform: translateY(-6px);
      border-color: rgba(180, 92, 255, 0.6);
    }

    /* IMAGE AREA */

    .logo-image {
      min-height: 280px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 35px;
    }

    .logo-image.color-version {
      background: #111111;
    }

    .logo-image.white-version {
      background: #ffffff;
    }

    .logo-image img {
      max-width: 90%;
      max-height: 230px;

      width: auto;
      height: auto;

      object-fit: contain;

      cursor: pointer;
    }

    /* INFO */

    .logo-info {
      padding: 20px;
    }

    .logo-info h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .logo-info p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .logo-label {
      display: inline-block;
      margin-top: 12px;

      color: #b45cff;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .logo-page {
        padding: 50px 6%;
      }

      .logo-gallery {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

  <main class="logo-page">

    <!-- BACK -->

    <a
      class="back-link"
      href="../../index.html#creative-work"
    >
      ← Back to Creative Work
    </a>


    <!-- TITLE -->

    <div class="logo-heading">

      <p class="eyebrow">
        CREATIVE PORTFOLIO
      </p>

      <h1>
        Logos
      </h1>

      <p>
        Selected logo designs presented in different
        color and background variations.
      </p>

    </div>


    <!-- LOGO GALLERY -->

    <div class="logo-gallery">


      <!-- COLOR VERSION -->

      <div class="logo-item">

        <div class="logo-image color-version">

          <img
            src="Logo_Black1.png"
            alt="Logo color version"
            onclick="openImage(this.src)"
          >

        </div>

        <div class="logo-info">

          <h3>
            Color Version
          </h3>

          <p>
            The primary colored version of the logo.
          </p>

          <span class="logo-label">
            COLOR LOGO
          </span>

        </div>

      </div>


      <!-- WHITE VERSION -->

      <div class="logo-item">

        <div class="logo-image white-version">

          <img
            src="Logo_White1.jpg"
            alt="Logo white version"
            onclick="openImage(this.src)"
          >

        </div>

        <div class="logo-info">

          <h3>
            White Version
          </h3>

          <p>
            A white version designed for dark backgrounds.
          </p>

          <span class="logo-label">
            WHITE LOGO
          </span>

        </div>

      </div>


    </div>

  </main>


  <!-- IMAGE VIEWER -->

  <div
    id="imageViewer"
    style="
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.9);
      z-index:9999;
      align-items:center;
      justify-content:center;
      padding:30px;
    "
    onclick="closeImage()"
  >

    <img
      id="largeImage"
      src=""
      alt="Expanded logo"
      style="
        max-width:95%;
        max-height:90vh;
        object-fit:contain;
      "
    >

  </div>


  <script>

    function openImage(src) {

      document.getElementById("largeImage").src = src;

      document.getElementById("imageViewer").style.display = "flex";

    }


    function closeImage() {

      document.getElementById("imageViewer").style.display = "none";

    }

  </script>

</body>
</html>
