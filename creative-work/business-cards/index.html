<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Cards | Eleniño Cabusas</title>

  <link rel="stylesheet" href="../../style.css">

  <style>
    .business-card-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 70px 7%;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 35px;
      color: #b45cff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .business-card-heading {
      margin-bottom: 45px;
    }

    .business-card-heading .eyebrow {
      margin-bottom: 10px;
    }

    .business-card-heading h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 5vw, 60px);
    }

    .business-card-heading p {
      max-width: 650px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    /* FRONT + BACK */

    .business-card-gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .business-card-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition: 0.3s ease;
    }

    .business-card-item:hover {
      transform: translateY(-6px);
      border-color: rgba(180, 92, 255, 0.6);
    }

    .business-card-item img {
      width: 100%;
      display: block;
      border-radius: 8px;
      cursor: pointer;
    }

    .business-card-label {
      margin-top: 15px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #b45cff;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .business-card-page {
        padding: 50px 6%;
      }

      .business-card-gallery {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <main class="business-card-page">

    <!-- BACK TO CREATIVE WORK -->
    <a
      class="back-link"
      href="../../index.html#creative-work"
    >
      ← Back to Creative Work
    </a>


    <!-- TITLE -->
    <div class="business-card-heading">

      <p class="eyebrow">
        CREATIVE PORTFOLIO
      </p>

      <h1>
        Business Cards
      </h1>

      <p>
        A business card design showcasing both the front and back
        of the card.
      </p>

    </div>


    <!-- BUSINESS CARD IMAGES -->
    <div class="business-card-gallery">


      <!-- FRONT -->
      <div class="business-card-item">

        <img
          src="Back.jpg"
          alt="Business card front design"
          onclick="openImage(this.src)"
        >

        <div class="business-card-label">
          FRONT
        </div>

      </div>


      <!-- BACK -->
      <div class="business-card-item">

        <img
          src="Front.jpg"
          alt="Business card back design"
          onclick="openImage(this.src)"
        >

        <div class="business-card-label">
          BACK
        </div>

      </div>

      <div class="business-card-item">

        <img
          src="Front2.jpg"
          alt="Business card front design"
          onclick="openImage(this.src)"
        >

        <div class="business-card-label">
          FRONT
        </div>

      </div>


      <!-- BACK -->
      <div class="business-card-item">

        <img
          src="Back2.jpg"
          alt="Business card back design"
          onclick="openImage(this.src)"
        >

        <div class="business-card-label">
          BACK
        </div>

      </div>


    </div>

  </main>


  <!-- IMAGE LIGHTBOX -->

  <div
    id="imageViewer"
    style="
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.9);
      z-index:9999;
      align-items:center;
      justify-content:center;
      padding:30px;
    "
    onclick="closeImage()"
  >

    <img
      id="largeImage"
      src=""
      alt="Expanded business card"
      style="
        max-width:95%;
        max-height:90vh;
        object-fit:contain;
        border-radius:8px;
      "
    >

  </div>


  <script>

    function openImage(src) {

      document.getElementById("largeImage").src = src;

      document.getElementById("imageViewer").style.display = "flex";

    }


    function closeImage() {

      document.getElementById("imageViewer").style.display = "none";

    }

  </script>

</body>
</html>
